name: Publish public Cheongma law portal
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/public_smoke.py'
      - '.github/workflows/publish-public-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: cheongma-public-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate public snapshot and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="radar-data" type="application/json">([\s\S]*?)</script>',s)
          assert m, "Site payload missing"
          d=json.loads(m.group(1))
          assert len(d["records"])>=50, "Relevant reference coverage regression"
          assert len(d.get("work_coverage",[]))==15, "Department work coverage missing"
          assert all(r.get("work_categories") for r in d["records"]), "Unrelated public record"
          assert d["summary"]["target_sites"]==36, "Displayed target scope mismatch"
          assert all(not r["key"].startswith("eims_") for r in d["records"]), "Excluded EIMS post leaked"
          assert all(s["id"]!="S07" for s in d["sources"]), "Excluded EIMS target leaked"
          city=d["summary"]["city_query_last_success"]
          total=d["summary"]["city_query_total"]
          assert total==17 and isinstance(city,int) and 0<=city<=total, "City coverage diagnostic invalid"
          assert d["summary"]["manual_cities"]==total-city, "City pending/success totals inconsistent"
          assert 'id="dashboard-stats"' in s and 'id="work-updates"' in s
          assert 'action="/logout"' not in s and '__Host-cm_session' not in s
          for item in ('AUTH_USERS_JSON','SESSION_SIGNING_KEY','private-users','private-secrets'):
              assert item not in s, "Protected deployment credential string leaked"
          js=re.search(r'<script>\s*\(\(\)=>\{[\s\S]*?\}\)\(\);\s*</script>',s)
          assert js, "Dashboard JS missing"
          Path('/tmp/cheongma-public.js').write_text(js.group(0).replace('<script>','').replace('</script>',''),encoding='utf-8')
          print("Public snapshot:",len(d["records"]),"records, city searches verified",city,"/",total)
          PY
          node --check /tmp/cheongma-public.js

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site only
        run: |
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          url=os.environ["GITHUB_API_URL"]+"/repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"]+"/artifacts"
          for attempt in range(18):
              request=Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urlopen(request,timeout=20) as response:
                  artifacts=json.load(response)["artifacts"]
              if any(a["name"]==os.environ["PAGES_ARTIFACT"] and not a["expired"] for a in artifacts):
                  print("Pages artifact metadata is visible.")
                  break
              if attempt==17:
                  raise SystemExit("Uploaded Pages artifact did not become visible; deployment not attempted.")
              print("Waiting for Pages artifact metadata:",attempt+1)
              time.sleep(5)
          PY
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retrying deployment metadata
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry deployment using the same uploaded artifact
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  test_public_site:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify publicly served browser UI
        env:
          PUBLIC_SITE_URL: https://leehonghun.github.io/cheongma-law-portal/
        run: python tests/public_smoke.py
      - name: Preserve public-site screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-law-portal-screenshot
          path: live-portal.png
          if-no-files-found: warn
          retention-days: 14
