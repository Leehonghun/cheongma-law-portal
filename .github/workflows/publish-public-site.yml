name: Publish public Cheongma law portal
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/public_smoke.py'
      - '.github/workflows/publish-public-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cheongma-public-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate public snapshot and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="radar-data" type="application/json">([\s\S]*?)</script>',s)
          assert m, "Site payload missing"
          d=json.loads(m.group(1))
          assert len(d["records"])>=300, "Coverage regression"
          city=d["summary"]["city_query_last_success"]
          total=d["summary"]["city_query_total"]
          assert total==17 and isinstance(city,int) and 0<=city<=total, "City coverage diagnostic invalid"
          assert d["summary"]["manual_cities"]==total-city, "City pending/success totals inconsistent"
          assert 'id="home-period"' in s and 'id="home-source"' in s
          assert 'action="/logout"' not in s and '__Host-cm_session' not in s
          for item in ('AUTH_USERS_JSON','SESSION_SIGNING_KEY','private-users','private-secrets'):
              assert item not in s, "Protected deployment credential string leaked"
          js=re.search(r'<script>\s*\(\(\)=>\{[\s\S]*?\}\)\(\);\s*</script>',s)
          assert js, "Dashboard JS missing"
          Path('/tmp/cheongma-public.js').write_text(js.group(0).replace('<script>','').replace('</script>',''),encoding='utf-8')
          print("Public snapshot:",len(d["records"]),"records, city searches verified",city,"/",total)
          PY
          node --check /tmp/cheongma-public.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site only
        run: |
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

  test_public_site:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify publicly served browser UI
        env:
          PUBLIC_SITE_URL: https://leehonghun.github.io/cheongma-law-portal/
        run: python tests/public_smoke.py
      - name: Preserve public-site screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-law-portal-screenshot
          path: live-portal.png
          if-no-files-found: warn
          retention-days: 14
